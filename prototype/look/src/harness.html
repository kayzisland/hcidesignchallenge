<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LockedIn look test: four designs</title>
<style>
:root { color-scheme: light; --ink:#1c1c1f; --soft:#5b5b63; --line:#d3d3da; --bg:#f1f1f3; --card:#fff; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 1680px; margin: 0 auto; padding: 18px 20px 60px; }
h1 { font-size: 22px; margin: 0 0 6px; } h2 { font-size: 24px; line-height: 1.25; margin: 0 0 6px; } h3 { font-size: 16px; margin: 0 0 6px; }
p { margin: 0 0 10px; } .soft { color: var(--soft); font-size: 14px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 18px; }
.narrow { max-width: 760px; }
label { display: block; font-weight: 600; margin: 12px 0 4px; }
input[type=text] { width: 100%; font: inherit; padding: 10px 12px; border: 2px solid #86868f; border-radius: 8px; background: #fff; color: var(--ink); }
button { font: inherit; cursor: pointer; }
.btn { min-height: 44px; padding: 8px 16px; border-radius: 8px; border: 2px solid var(--ink); background: #fff; color: var(--ink); font-weight: 600; }
.btn.on { background: var(--ink); color: #fff; } .btn:disabled { opacity: .4; cursor: not-allowed; } .btn.small { min-height: 36px; padding: 4px 12px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.top { display: flex; justify-content: space-between; gap: 16px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.grid4 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin: 12px 0; }
.grid4.phone { grid-template-columns: repeat(4, minmax(0, 1fr)); max-width: 1100px; }
.cell { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
.cell h3 { display: flex; justify-content: space-between; align-items: center; }
.frame { position: relative; overflow: hidden; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
.frame iframe { border: 0; transform-origin: 0 0; display: block; background: #fff; }
.frame .open { position: absolute; inset: 0; background: transparent; border: 0; cursor: zoom-in; }
.picks { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 14px; align-items: center; margin-top: 6px; }
.seg { display: inline-flex; border: 2px solid var(--ink); border-radius: 8px; overflow: hidden; }
.seg button { min-width: 48px; min-height: 40px; border: 0; border-left: 2px solid var(--ink); background: #fff; color: var(--ink); font-weight: 700; padding: 0 12px; }
.seg button:first-child { border-left: 0; } .seg button.on { background: var(--ink); color: #fff; }
#full { position: fixed; inset: 0; background: #000c; display: none; z-index: 9; padding: 16px; overflow: auto; }
#full .bar { display: flex; justify-content: space-between; color: #fff; margin: 0 auto 8px; max-width: 1280px; font-weight: 700; }
#full iframe { display: block; margin: 0 auto; border: 0; background: #fff; border-radius: 6px; }
pre { white-space: pre-wrap; background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 12px; font: 13px/1.45 ui-monospace, Menlo, monospace; max-height: 460px; overflow: auto; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0; }
table { border-collapse: collapse; width: 100%; font-size: 14px; } th, td { border: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
body.sheet { background: #fff; } body.sheet main { max-width: none; }
:focus-visible { outline: 3px solid #2f6fe4; outline-offset: 2px; }
textarea { width: 100%; font: 13px/1.45 ui-monospace, Menlo, monospace; padding: 10px 12px; border: 2px solid #86868f; border-radius: 8px; min-height: 180px; }
details { margin: 8px 0; } summary { cursor: pointer; font-weight: 600; color: var(--soft); }
.say { background: #f7f7f9; border-left: 4px solid var(--ink); padding: 10px 14px; border-radius: 4px; margin: 8px 0; }
.warn { color: #8a4b00; font-weight: 600; font-size: 14px; }
.check { display: flex; gap: 10px; align-items: flex-start; font-weight: 600; margin: 14px 0 4px; }
.check input { width: 22px; height: 22px; margin-top: 2px; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 16px; }
.flag { font-weight: 700; } .ok { color: #1d6b35; } .no { color: #8a4b00; }
</style>
</head>
<body>
<main id="app"></main>
<div id="full"><div class="bar"><span id="fullname"></span><button class="btn small" id="fullclose">Close</button></div><iframe title="Full size"></iframe></div>
<script>
/*DATA*/
/*DESIGNS*/
</script>
<script>
const D = LOOK.designs, S = LOOK.screens;
const $ = (s) => document.querySelector(s);
const el = (tag, attrs = {}, ...kids) => { const n = document.createElement(tag); for (const [k, v] of Object.entries(attrs)) { if (k === "on") for (const [e, f] of Object.entries(v)) n.addEventListener(e, f); else if (k === "text") n.textContent = v; else if (v !== false && v != null) n.setAttribute(k, v === true ? "" : v); } n.append(...kids.flat().filter((k) => k != null)); return n; };
const params = new URLSearchParams(location.search);
const size = (s) => s.device === "phone" ? { w: 390, h: 780 } : { w: 1280, h: 800 };
// The designs are pictures: their links (href="#") must go nowhere. Inside an embedded screen, "#" resolves to this test page,
// so a click would load the whole test inside the design. This stops every link click while keeping hover styles.
const INERT = `<script>document.addEventListener("click",function(e){if(e.target.closest&&e.target.closest("a,form"))e.preventDefault();},true);document.addEventListener("submit",function(e){e.preventDefault();},true);<\/script>`;
const doc = (d, html) => `<!doctype html><html lang="en"><head><meta charset="utf-8">${(d.fonts || []).map((u) => `<link rel="stylesheet" href="${u}">`).join("")}<style>html,body{margin:0}${d.css}</style>${INERT}</head><body>${html}</body></html>`;
const screenDoc = (d, s) => doc(d, d.screens[s.id](LOOK.data));

// What the facilitator asks before the tester has seen the other three versions. The answer is the same in every design.
// Question set v2 (27 Nov). v1 asked "What is the next thing this app wants you to do?" on Today, which has two plausible answers
// (the History card and the 15:00 block), and "How many questions are left after this one?" on the Practise question, which tests
// subtraction rather than the design. Both are now a "show me" task with one answer. The other five are unchanged from v1,
// so their reading results stay comparable across every tester.
const QV = 2;
const ASK = {
  today: ["You want to carry on with the History you started earlier. Show me where you'd tap.", "The Continue button on the History card (The Welfare State, 1945 to 1951)"],
  learn: ["Which idea are you on, and what comes after it?", "Idea 2 of 4; next is \"When models go wrong\""],
  question: ["Before you answer, you want to say you're only guessing. Show me how.", "Under \"How sure are you?\", tap \"Guess\""],
  feedback: ["Which answer was right, and which one had you picked?", "Right: \"…about 3% of the time\". Picked: \"a 3% chance the hypothesis is true\""],
  progress: ["Which module has had the least of your time this week?", "Modern British History (20 min)"],
  week: ["When is your next study block?", "Today, Thursday, at 15:00 (HCI)"],
  phone: ["Why did this question arrive now?", "The lecture ended and you are free till 15:00"],
};
const CHANGED_IN_V2 = ["today", "question"];
// What to watch for on each screen during the first look. For the facilitator and note-taker only.
const WATCH = {
  today: "Where do their eyes go first: the History card, the 15:00 block, or the numbers? Do they see two next steps or one?",
  learn: "Do they read the paragraphs or skim? Do they notice where they are in the session (idea 2 of 4)?",
  question: "Do they find the \"How sure are you?\" control without hunting? Do they notice the slide panel and \"Show me first\"?",
  feedback: "Can they tell right from wrong without relying on colour? How do they react to \"Not quite\": calm, flat, or told off?",
  progress: "Do the numbers feel like information or a grade? Any sign of pressure (\"I'm behind\")?",
  week: "Can they tell lectures, the work shift and study blocks apart? Do they see which block is only suggested?",
  phone: "Would they answer it or dismiss it? Do they read the \"why now\" line?",
};
// The parts of the look, in the order of the QOC's questions Q1 to Q8 (ideate/visual-design-space.md). Q9, motion, can't be shown in stills.
const AXES = [
  ["layout", "Whose way of laying out a screen?", "Q1 Composition"],
  ["density", "Whose amount on each screen felt right?", "Q3 Density"],
  ["menu", "Whose menu did you like best?", "Q2 Menu"],
  ["numbers", "Whose way of showing numbers and progress?", "Q4 Numbers"],
  ["shape", "Whose buttons and boxes?", "Q5 Shape"],
  ["type", "Whose text was easiest to read?", "Q6 Type"],
  ["colour", "Whose colours?", "Q7 Colour"],
  ["icons", "Whose icons, or lack of them?", "Q8 Icons"],
];
const PICKS = [["use", "Which would you rather use?"], ["clutter", "Which feels the most cluttered?"], ["pressure", "Which puts the most pressure on you?"]];
const CLOSING = [
  ["who", "Who do you think this app is for? Does it feel like it's for someone like you?"],
  ["readable", "Was any text too small or hard to read, in any of them?"],
  ["change", "If you could change one thing about the look of the one you picked, what would it be?"],
  ["other", "Anything else they said or did worth keeping"],
];

const KEY = "lockedin-look-four", HISTORY = "lockedin-look-history";
const fresh = () => ({ id: "", at: -1, sub: 0, seen: {}, picks: {}, axes: {}, overall: null, words: {}, closing: {}, info: {}, started: null, qv: QV });
const load = (k, fallback) => { try { return JSON.parse(localStorage.getItem(k) || "null") ?? fallback; } catch { return fallback; } };
let st = (() => { const saved = load(KEY, {}); return { ...fresh(), ...saved, qv: saved.id && !saved.qv ? 1 : (saved.qv ?? QV) }; })();
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch {} };
const hash = (s) => { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return Math.abs(h); };
// Each tester gets their own letters for the four designs, kept for the whole session, so "B" never means the same design twice in a row of testers.
function letters() { const a = [...D.keys()]; let h = hash(st.id || "x"); for (let i = a.length - 1; i > 0; i--) { h = Math.imul(h ^ (h >>> 13), 1274126177) >>> 0; const j = h % (i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const L = "ABCD";
const byLetter = () => letters().map((di, i) => ({ d: D[di], letter: L[i] }));
// Which single design a tester meets first on each screen rotates, so every design is met first equally often across testers and screens.
const firstFor = (si) => byLetter()[(hash(st.id || "x") + si) % D.length];

function frame(d, s, width, clickName) {
  const z = size(s), k = width / z.w;
  const f = el("iframe", { title: clickName || d.name, width: z.w, height: z.h, scrolling: "no", tabindex: "-1" });
  f.srcdoc = screenDoc(d, s); f.style.transform = `scale(${k})`;
  const box = el("div", { class: "frame", style: `width:${width}px;height:${Math.round(z.h * k)}px` }, f);
  if (clickName) box.append(el("button", { class: "open", "aria-label": `Open ${clickName} full size`, on: { click: () => openFull(d, s, clickName) } }));
  return box;
}
function openFull(d, s, name) { viewerFull = { d, s, name }; syncViewer(); const z = size(s), f = $("#full iframe"); f.width = z.w; f.height = Math.max(z.h, innerHeight - 90); f.srcdoc = screenDoc(d, s); $("#fullname").textContent = name; $("#full").style.display = "block"; }
$("#fullclose").addEventListener("click", () => { $("#full").style.display = "none"; viewerFull = null; syncViewer(); });
const cellWidth = (s) => s.device === "phone" ? 240 : Math.max(420, Math.min(790, Math.floor((Math.min(innerWidth, 1680) - 40 - 14 - 44) / 2)));
const seg = (options, current, onPick) => el("div", { class: "seg" }, options.map(([v, t]) => el("button", { class: current === v ? "on" : "", text: t ?? v, on: { click: () => onPick(v) } })));
const letterSeg = (current, onPick, withNone = true) => seg([...[...L].slice(0, D.length).map((x) => [x, x]), ...(withNone ? [["none", "None"]] : [])], current, onPick);
const topBar = (text, back) => el("div", { class: "top" }, el("span", { class: "soft", text: text + (viewerOpen() ? " · tester window open: share that one" : "") }), el("div", { class: "row" }, viewerButton(), el("button", { class: "btn small", text: back ? "Back" : "Back to start", on: { click: back || (() => { st.at = -1; save(); render(); }) } })));

const CONSENT = "Thanks for doing this. It takes about 25 minutes. You'll see seven screens of a study app our HCI group is designing, each drawn in four different styles. Everything on them is made up: a sample student, sample lectures, nothing of yours. We're testing the designs, not you, so there are no wrong answers, and it's fine to dislike all of them. We'll take notes on what you say under an ID like V01, never your name. Your name won't appear in anything we submit, and quotes will be anonymised. You can skip anything or stop at any time without giving a reason. Are you happy to take part?";
const INTRO = "Imagine you're a student and it's Thursday afternoon, just after 1 pm. Your lecture has just finished. You'll see one screen at a time. Please say what you're thinking out loud as you look: what you notice, what you expect, anything that confuses you.";

function home() {
  const i = st.info || {};
  const input = (k, label, ph) => [el("label", { for: `f-${k}`, text: label }), el("input", { type: "text", id: `f-${k}`, value: i[k] || "", placeholder: ph || "", autocomplete: "off", on: { input: (e) => { st.info = { ...st.info, [k]: e.target.value }; save(); } } })];
  const id = el("input", { type: "text", id: "pid", value: st.id, placeholder: "V01, V02 …", autocomplete: "off" });
  const warn = el("p", { class: "warn" });
  const checkId = () => { const v = id.value.trim(); warn.textContent = /^[PH]\d/i.test(v) ? "P and H IDs belong to the lo-fi test (T18) and the hi-fi test (T23). Use V01, V02 … for the look test so the results can't be mixed up." : ""; };
  id.addEventListener("input", checkId); checkId();
  const consent = el("input", { type: "checkbox", id: "consent", checked: !!i.consent, on: { change: (e) => { st.info = { ...st.info, consent: e.target.checked }; save(); } } });
  // Updates the buttons in place rather than redrawing, so nothing typed on this page is lost.
  const pick = (k, opts) => { const g = seg(opts.map((o) => [o, o]), i[k], (v) => { st.info = { ...st.info, [k]: v }; save(); [...g.children].forEach((btn) => btn.classList.toggle("on", btn.textContent === v)); }); return g; };
  const err = el("p", { class: "warn" });
  const hist = load(HISTORY, []);
  $("#app").replaceChildren(el("div", { class: "card narrow" },
    el("h1", { text: "LockedIn look test: four designs" }),
    el("p", { class: "soft", text: "For the facilitator. The same seven screens, with the same content, drawn four ways. Only the look differs. Testers see the designs as A, B, C and D; which letter is which design changes with every tester ID." }),
    el("h3", { style: "margin-top:16px", text: "1. Read the consent script, word for word" }),
    el("div", { class: "say", text: CONSENT }),
    el("label", { class: "check", for: "consent" }, consent, el("span", { text: "They said a clear yes" })),
    el("h3", { style: "margin-top:16px", text: "2. Session details (never a name)" }),
    el("label", { for: "pid", text: "Tester ID" }), id, warn,
    el("div", { class: "two" },
      el("div", {}, ...input("subject", "Subject (ask: \"What do you study?\")", "e.g. History")),
      el("div", {}, ...input("year", "Year", "e.g. 2"))),
    el("label", { text: "STEM or not (the rule needs at least half non-STEM)" }), pick("stem", ["STEM", "non-STEM", "prefer not to say"]),
    el("label", { text: "Session" }), pick("mode", ["in person", "online"]),
    el("div", { class: "two" },
      el("div", {}, ...input("facilitator", "Facilitator")),
      el("div", {}, ...input("notetaker", "Note-taker", "or \"none\""))),
    el("h3", { style: "margin-top:16px", text: "Online? Open the tester window" }),
    el("p", { class: "soft", text: "It shows the tester only the designs, never these prompts, answers or buttons. In Teams, share that window, not this one. Keep this window on your side to run the test." }),
    el("div", { class: "row" }, viewerButton()),
    el("h3", { style: "margin-top:16px", text: "3. Then say" }),
    el("div", { class: "say", text: INTRO }),
    err,
    el("div", { class: "row", style: "margin-top:10px" },
      el("button", { class: "btn on", text: st.id && st.at >= 0 ? "Carry on" : "Start the test", on: { click: () => {
        const v = id.value.trim();
        if (!v) { err.textContent = "Type a tester ID first."; return id.focus(); }
        if (!st.info?.consent) { err.textContent = "Tick consent first. Don't start without a clear yes."; return; }
        if (v !== st.id) { const keep = st.info; st = fresh(); st.id = v; st.info = keep; }
        if (st.at < 0) st.at = 0; st.started ??= new Date().toISOString(); save(); render(); scrollTo(0, 0); } } }),
      el("a", { class: "btn", href: "?browse=1", text: "Browse the designs" }),
      el("a", { class: "btn", href: "?sheet=all", text: "Sheets for the deck" }),
      el("a", { class: "btn", href: "?tally=1", text: `Tally all testers${hist.length ? ` (${hist.length} on this laptop)` : ""}` }),
      Object.keys(st.picks).length ? el("button", { class: "btn", text: "Results so far", on: { click: () => { st.at = S.length + 1; save(); render(); } } }) : null)));
}

// Step 1 of a screen: one design alone. A first-glance question, then a reading question, timed from when it is asked.
function alone(s, si) {
  const { d, letter } = firstFor(si);
  const seen = st.seen[s.id] || {};
  const note = el("input", { type: "text", id: "first", value: seen.first || "", placeholder: "What they said they noticed first, in their words", autocomplete: "off" });
  const keep = () => ({ ...(st.seen[s.id] || {}), design: d.id, letter, first: note.value });
  const ask = () => { st.seen[s.id] = { ...keep(), asked: Date.now(), read: undefined, secs: undefined }; save(); render(); };
  const mark = (v) => { const cur = keep(); st.seen[s.id] = { ...cur, read: v, secs: cur.secs ?? Math.round((Date.now() - cur.asked) / 1000) }; save(); render(); };
  const w = s.device === "phone" ? 390 : Math.min(1280, innerWidth - 60);
  const asked = !!seen.asked;
  $("#app").replaceChildren(
    topBar(`${st.id} · screen ${si + 1} of ${S.length} · ${s.name} · first look (design ${letter})`),
    el("div", { class: "card", style: "margin-bottom:12px" },
      el("p", {}, el("b", { text: "Ask 1: " }), "\"What do you notice first?\"", el("span", { class: "soft", text: "  Let them talk. Don't point at anything." })), note,
      el("details", {}, el("summary", { text: "What to watch for (note-taker)" }), el("p", { class: "soft", style: "margin-top:6px", text: WATCH[s.id] })),
      asked
        ? el("div", {},
            el("p", { style: "margin-top:10px" }, el("b", { text: "Ask 2: " }), `"${ASK[s.id][0]}"`),
            el("details", {}, el("summary", { text: "Answer (facilitator only: keep it folded while they look)" }), el("p", { class: "soft", style: "margin-top:6px", text: ASK[s.id][1] })),
            el("div", { class: "row" }, ...[["right", "Right"], ["partly", "Partly, or with help"], ["wrong", "Wrong, or gave up"]].map(([v, t]) => el("button", { class: seen.read === v ? "btn on" : "btn", text: t, on: { click: () => mark(v) } })),
              seen.read ? el("span", { class: "soft", text: `${seen.secs} s from asking` }) : el("span", { class: "soft", text: "Timing from when you pressed Ask" }),
              el("button", { class: "btn on", style: "margin-left:auto", text: "Show all four", disabled: !seen.read, on: { click: () => { st.seen[s.id].first = note.value; st.sub = 1; save(); render(); scrollTo(0, 0); } } })))
        : el("div", { class: "row", style: "margin-top:10px" },
            el("button", { class: "btn on", text: "Ask the reading question (starts the timer)", on: { click: ask } }),
            el("span", { class: "soft", text: "Press this as you start reading it out." }))),
    frame(d, s, w));
  const f = document.querySelector(".frame iframe"); f.setAttribute("scrolling", "yes"); f.removeAttribute("tabindex");
}

// Step 2: all four side by side.
function four(s, si) {
  const p = st.picks[s.id] || {};
  const why = el("input", { type: "text", id: "why", value: p.why || "", placeholder: "Their reasons, in their words", autocomplete: "off" });
  const set = (k, v) => { st.picks[s.id] = { ...(st.picks[s.id] || {}), [k]: v, why: why.value }; save(); render(); };
  const grid = el("div", { class: `grid4 ${s.device}` }, byLetter().map(({ d, letter }) => el("div", { class: "cell" }, el("h3", {}, el("span", { text: `Design ${letter}` }), el("button", { class: "btn small", text: "Open full size", on: { click: () => openFull(d, s, `Design ${letter}`) } })), frame(d, s, cellWidth(s), `Design ${letter}`))));
  const picks = el("div", { class: "picks" }, PICKS.flatMap(([k, q]) => [el("b", { text: q }), letterSeg(p[k], (x) => set(k, x))]));
  const done = PICKS.every(([k]) => p[k]);
  $("#app").replaceChildren(
    topBar(`${st.id} · screen ${si + 1} of ${S.length} · ${s.name} · all four`),
    el("h2", { text: `${s.name}: the same screen, four ways` }), el("p", { class: "soft", text: "Each shows the top of the screen. Open any of them full size to scroll. Give them a moment to look at all four before asking." }),
    grid,
    el("div", { class: "card narrow" }, picks,
      el("label", { for: "why", text: "Why? Ask about each pick: \"What makes that one cluttered?\", \"What about it feels like pressure?\"" }), why,
      el("div", { class: "row", style: "margin-top:14px" }, el("button", { class: "btn", text: "Back", on: { click: () => { if (st.picks[s.id]) st.picks[s.id].why = why.value; st.sub = 0; save(); render(); } } }), el("button", { class: "btn on", text: "Next", disabled: !done, on: { click: () => { st.picks[s.id].why = why.value; st.at = si + 1; st.sub = 0; save(); render(); scrollTo(0, 0); } } }))));
}

// The end: one pick per part of the look, one overall, one word each, and the closing questions.
function wrap() {
  const s0 = S[0];
  const strip = el("div", { class: "grid4 phone", style: "max-width:none" }, byLetter().map(({ d, letter }) => el("div", { class: "cell" }, el("h3", {}, el("span", { text: `Design ${letter}` })), frame(d, s0, 360, `Design ${letter}`),
    el("input", { type: "text", value: st.words[letter] || "", placeholder: "One word for this design", "aria-label": `One word for design ${letter}`, style: "margin-top:8px", on: { input: (e) => { st.words[letter] = e.target.value; save(); } } }))));
  const q = (k, text, store) => [el("b", { text }), letterSeg(store[k], (x) => { store[k] = x; save(); render(); })];
  $("#app").replaceChildren(
    topBar(`${st.id} · last step`, () => { st.at = S.length - 1; st.sub = 1; save(); render(); }),
    el("h2", { text: "Looking back over all of them" }),
    el("p", { class: "soft", text: "Say: \"Forget which one you'd use as a whole for a moment. For each part of the look, whose did you like best?\" They can open any screen again with Back." }),
    strip,
    el("div", { class: "card narrow" }, el("div", { class: "picks" }, AXES.flatMap(([k, t]) => q(k, t, st.axes)),
      el("b", { text: "If the whole app had to be one of these, which?" }), letterSeg(st.overall, (x) => { st.overall = x; save(); render(); }, false)),
      el("h3", { style: "margin-top:18px", text: "Closing questions" }),
      ...CLOSING.flatMap(([k, t]) => [el("label", { for: `c-${k}`, text: t }), el("input", { type: "text", id: `c-${k}`, value: st.closing[k] || "", autocomplete: "off", on: { input: (e) => { st.closing[k] = e.target.value; save(); } } })]),
      el("div", { class: "row", style: "margin-top:14px" }, el("button", { class: "btn on", text: "Finish", disabled: !st.overall, on: { click: () => { st.finished = new Date().toISOString(); st.at = S.length + 1; save(); keepInHistory(); render(); scrollTo(0, 0); } } }))));
}

function resultsText(t) {
  const name = Object.fromEntries(byLetter().map(({ d, letter }) => [letter, d.name]));
  const show = (x) => !x ? "-" : x === "none" ? "none" : `${x} (${name[x]})`;
  const i = t.info || {};
  const lines = [`Look test, four designs · tester ${t.id} · started ${t.started ?? ""} · finished ${t.finished ?? new Date().toISOString()}`,
    `Questions: v${t.qv ?? 1}`,
    `Session: subject "${i.subject || "-"}"; ${i.stem || "STEM not recorded"}; year ${i.year || "-"}; ${i.mode || "mode not recorded"}; facilitator ${i.facilitator || "-"}; note-taker ${i.notetaker || "-"}; consent ${i.consent ? "yes" : "NOT RECORDED"}`,
    `Letters for this tester: ${Object.entries(name).map(([l, n]) => `${l}=${n}`).join(", ")}`, ""];
  S.forEach((s) => { const a = t.seen[s.id], p = t.picks[s.id];
    lines.push(`${s.name}`);
    lines.push(a && a.read ? `   first look at ${a.letter} (${name[a.letter]}): noticed first "${a.first || "-"}"; reading question ${a.read}, ${a.secs} s` : "   first look: not done");
    lines.push(p ? `   would use ${show(p.use)}; most cluttered ${show(p.clutter)}; most pressure ${show(p.pressure)}` : "   four-way: not done");
    if (p) lines.push(`   why: ${p.why || "-"}`); });
  lines.push("", "Looking back");
  AXES.forEach(([k, txt]) => lines.push(`   ${txt} ${show(t.axes[k])}`));
  lines.push(`   whole app: ${show(t.overall)}`, `   one word each: ${Object.entries(name).map(([l, n]) => `${n} "${t.words[l] || "-"}"`).join("; ")}`);
  lines.push("", "Closing");
  CLOSING.forEach(([k, txt]) => lines.push(`   ${txt} ${(t.closing || {})[k] || "-"}`));
  return lines.join("\n");
}
function keepInHistory() { const h = load(HISTORY, []).filter((x) => x.id !== st.id); h.push({ id: st.id, text: resultsText(st) }); try { localStorage.setItem(HISTORY, JSON.stringify(h)); } catch {} }

async function copyText(text, button, pre) {
  try { await navigator.clipboard.writeText(text); button.textContent = "Copied"; }
  catch { const r = document.createRange(); r.selectNodeContents(pre); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); button.textContent = "Selected: press Ctrl+C (Cmd+C on a Mac)"; }
}

function results() {
  const text = resultsText(st);
  const pre = el("pre", { text });
  $("#app").replaceChildren(el("div", { class: "card", style: "max-width:940px" }, el("h1", { text: `Results for ${st.id}` }),
    el("p", { class: "soft", text: "Copy this into prototype/look/interview_results.md before the next tester. Record only what happened; a blank stays blank. This laptop also keeps a copy for the tally." }), pre,
    el("div", { class: "row" }, el("button", { class: "btn on", text: "Copy results", on: { click: (e) => copyText(text, e.target, pre) } }),
      el("button", { class: "btn", text: "Back", on: { click: () => { st.at = S.length; save(); render(); } } }),
      el("a", { class: "btn", href: "?tally=1", text: "Tally all testers" }),
      el("button", { class: "btn", text: "Next tester (clears this one)", on: { click: () => { if (confirm("Clear this tester's answers? Copy them first.")) { try { localStorage.removeItem(KEY); } catch {} st = fresh(); render(); scrollTo(0, 0); } } } }))));
}

// ?tally=1: reads any number of pasted results (including ones from before 27 Nov) and applies the rule in ideate/visual-design-space.md.
function parseResults(text) {
  const names = D.map((d) => d.name), screenNames = S.map((s) => s.name);
  const nameOf = (v) => { const m = /\(([^)]+)\)/.exec(v || ""); return m && names.includes(m[1]) ? m[1] : (v || "").trim() === "none" ? "none" : null; };
  const allAxisTexts = [...AXES.map(([k, t]) => [k, t])];
  const out = [];
  const blocks = text.split(/(?=^Look test, four designs · tester )/m).filter((b) => b.startsWith("Look test, four designs"));
  for (const b of blocks) {
    const r = { id: /tester (.+?) · started/.exec(b)?.[1]?.trim() || "?", qv: +(/^Questions: v(\d+)/m.exec(b)?.[1] || 1), stem: null, screens: {}, axes: {}, overall: null, words: {} };
    const sess = /^Session: (.*)$/m.exec(b)?.[1] || "";
    r.stem = /non-STEM/.test(sess) ? "non-STEM" : /\bSTEM\b/.test(sess) && !/STEM not recorded/.test(sess) ? "STEM" : /prefer not to say/.test(sess) ? "prefer not to say" : null;
    r.subject = /subject "([^"]*)"/.exec(sess)?.[1] || null;
    let cur = null, inBack = false;
    for (const raw of b.split("\n")) {
      const line = raw.trim();
      if (screenNames.includes(line)) { cur = S[screenNames.indexOf(line)].id; r.screens[cur] = {}; continue; }
      if (line === "Looking back") { inBack = true; cur = null; continue; }
      if (line === "Closing") { inBack = false; continue; }
      if (cur) {
        let m = /^first look at [A-D] \(([^)]+)\): noticed first "(.*)"; reading question (right|partly|wrong), (\d+) s/.exec(line);
        if (m) Object.assign(r.screens[cur], { firstDesign: m[1], noticed: m[2], read: m[3], secs: +m[4] });
        m = /^would use (.+?); most cluttered (.+?); most pressure (.+)$/.exec(line);
        if (m) Object.assign(r.screens[cur], { use: nameOf(m[1]), clutter: nameOf(m[2]), pressure: nameOf(m[3]) });
        m = /^why: (.*)$/.exec(line); if (m) r.screens[cur].why = m[1];
      }
      if (inBack) {
        for (const [k, t] of allAxisTexts) if (line.startsWith(t)) r.axes[k] = nameOf(line.slice(t.length));
        let m = /^whole app: (.+)$/.exec(line); if (m) r.overall = nameOf(m[1]);
        m = /^one word each: (.*)$/.exec(line); if (m) for (const w of m[1].matchAll(/([A-Za-z ]+?) "([^"]*)"/g)) r.words[w[1].trim()] = w[2];
      }
    }
    out.push(r);
  }
  return out;
}

function tally() {
  const hist = load(HISTORY, []);
  const box = el("textarea", { id: "paste", placeholder: "Paste every tester's results here (the whole of interview_results.md is fine). Testers finished on this laptop are included automatically." });
  const outArea = el("div", {});
  const run = () => {
    const parsed = parseResults([box.value, ...hist.map((h) => h.text)].join("\n\n"));
    const byId = new Map(); for (const r of parsed) byId.set(r.id, r); // a tester pasted twice counts once
    outArea.replaceChildren(...tallyView([...byId.values()]));
  };
  box.addEventListener("input", run);
  $("#app").replaceChildren(el("div", { class: "top" }, el("h1", { text: "Tally: all testers" }), el("a", { class: "btn small", href: "?", text: "Back to the test" })),
    el("div", { class: "card", style: "max-width:1100px" },
      el("p", { class: "soft", text: "Applies the rule written before the first tester (ideate/visual-design-space.md). The rule's outcomes are suggestions for the group, not decisions." }),
      box,
      el("div", { class: "row", style: "margin:8px 0" }, el("span", { class: "soft", text: `${hist.length} tester(s) stored on this laptop${hist.length ? `: ${hist.map((h) => h.id).join(", ")}` : ""}.` }),
        ...hist.map((h) => el("button", { class: "btn small", text: `Remove ${h.id}`, on: { click: () => { if (confirm(`Remove ${h.id} from this laptop's tally? Their copied results are not affected.`)) { try { localStorage.setItem(HISTORY, JSON.stringify(hist.filter((x) => x.id !== h.id))); } catch {} tally(); } } } }))),
      outArea));
  run();
}

function tallyView(rs) {
  const names = D.map((d) => d.name), n = rs.length, md = [];
  if (!n) return [el("p", { text: "No results yet. Paste some above." })];
  const count = (vals) => { const c = Object.fromEntries([...names, "none"].map((x) => [x, 0])); vals.forEach((v) => { if (v && v in c) c[v]++; }); return c; };
  const nonStem = rs.filter((r) => r.stem === "non-STEM").length, unknown = rs.filter((r) => !r.stem).length;
  const need = n >= 5 ? Math.ceil(0.7 * n) : null;
  const header = `${n} tester(s): ${rs.map((r) => r.id).join(", ")}. Non-STEM: ${nonStem} of ${n}${unknown ? ` (${unknown} not recorded)` : ""}.`;
  const mix = nonStem * 2 >= n ? "Subject mix meets the rule (at least half non-STEM)." : "Subject mix does not yet meet the rule: at least half should be non-STEM.";
  const enough = need ? `Adopting an option needs ${need} of ${n}.` : "The rule needs at least 5 testers before any option is adopted. Counts below are early signals only.";
  md.push(`# Look test tally`, "", header, mix, enough, "");
  const nodes = [el("h2", { text: `${n} tester${n === 1 ? "" : "s"}` }), el("p", { text: header }), el("p", { class: nonStem * 2 >= n ? "ok" : "no", text: mix }), el("p", { class: need ? "" : "no", text: enough })];

  // Parts of the look: adopt, setting, or keep what is built.
  const axRows = AXES.map(([k, t, q]) => {
    const vals = rs.map((r) => r.axes[k]).filter(Boolean), c = count(vals), answered = vals.length;
    const top = names.map((x) => [x, c[x]]).sort((a, b) => b[1] - a[1]);
    let verdict;
    if (answered < 5) verdict = `Too few answers yet (${answered}).`;
    else { const needHere = Math.ceil(0.7 * answered); verdict = top[0][1] >= needHere ? `Adopt ${top[0][0]}'s answer (${top[0][1]} of ${answered}), unless a reading result points the other way.` : `No winner. Make it a setting if their reasons are about taste; otherwise keep what is built (Soft Focus).`; }
    return [q, t, ...names.map((x) => c[x]), c.none, answered, verdict];
  });
  const whole = count(rs.map((r) => r.overall));
  const table = (head, rows) => el("table", {}, el("tr", {}, head.map((h) => el("th", { text: h }))), rows.map((row) => el("tr", {}, row.map((v) => el("td", { text: String(v) })))));
  const mdTable = (head, rows) => [`| ${head.join(" | ")} |`, `|${head.map(() => "---").join("|")}|`, ...rows.map((row) => `| ${row.join(" | ")} |`)].join("\n");
  const axHead = ["QOC", "Question", ...names, "None", "Answered", "What the rule says"];
  nodes.push(el("h3", { style: "margin-top:16px", text: "Parts of the look (rule: adopt, make a setting, or keep what is built)" }), table(axHead, axRows));
  md.push("## Parts of the look", "", mdTable(axHead, axRows), "");
  const wholeRow = [["Whole app", ...names.map((x) => whole[x])]];
  nodes.push(el("h3", { style: "margin-top:16px", text: "If the whole app had to be one" }), table(["", ...names], wholeRow));
  md.push("## Whole app", "", mdTable(["", ...names], wholeRow), "");

  // Screens: would use, cluttered, pressure, and reading results by the design met first.
  const scrHead = ["Screen", "Would use", "Most cluttered", "Most pressure", "Reading (design met first: result)", "Rule flags"];
  const fmt = (c) => names.filter((x) => c[x]).map((x) => `${x} ${c[x]}`).concat(c.none ? [`none ${c.none}`] : []).join(", ") || "-";
  const scrRows = S.map((s) => {
    const sc = rs.map((r) => r.screens[s.id]).filter(Boolean), m = sc.length;
    const use = count(sc.map((x) => x.use)), clut = count(sc.map((x) => x.clutter)), pres = count(sc.map((x) => x.pressure));
    const valid = rs.filter((r) => r.screens[s.id]?.read && !(CHANGED_IN_V2.includes(s.id) && r.qv < 2)).map((r) => r.screens[s.id]);
    const reading = names.map((x) => { const f = valid.filter((v) => v.firstDesign === x); if (!f.length) return null; const w = f.filter((v) => v.read === "wrong").length, ok = f.filter((v) => v.read === "right").length; return `${x}: ${ok} right, ${f.length - ok - w} partly, ${w} wrong`; }).filter(Boolean).join("; ") || "-";
    const flags = [];
    names.forEach((x) => { if (m && clut[x] * 2 > m) flags.push(`${x} most cluttered for a majority (${clut[x]} of ${m})`); if (m && pres[x] * 2 > m) flags.push(`${x} most pressuring for a majority (${pres[x]} of ${m})`);
      const f = valid.filter((v) => v.firstDesign === x), w = f.filter((v) => v.read === "wrong").length; if (f.length && w * 2 > f.length) flags.push(`${x}: ${w} of ${f.length} who met it first got the reading question wrong${f.length < 3 ? " (too few to act on)" : ""}`); });
    return [s.name, fmt(use), fmt(clut), fmt(pres), reading, flags.join("; ") || "-"];
  });
  nodes.push(el("h3", { style: "margin-top:16px", text: "Screen by screen (rule: rule an option out for a screen)" }), table(scrHead, scrRows));
  md.push("## Screen by screen", "", mdTable(scrHead, scrRows), "");
  const v1 = rs.filter((r) => r.qv < 2).map((r) => r.id);
  if (v1.length) { const note = `Reading results on Today and A Practise question leave out ${v1.join(", ")}: those sessions used the v1 questions, which changed on 27 Nov.`; nodes.push(el("p", { class: "soft", text: note })); md.push(note, ""); }

  // One word each.
  const wordRows = names.map((x) => [x, rs.map((r) => r.words[x]).filter((w) => w && w !== "-").join(", ") || "-"]);
  nodes.push(el("h3", { style: "margin-top:16px", text: "One word each" }), table(["Design", "Words"], wordRows));
  md.push("## One word each", "", mdTable(["Design", "Words"], wordRows), "");
  const mdText = md.join("\n"), pre = el("pre", { text: mdText, style: "display:none" });
  nodes.push(el("div", { class: "row", style: "margin-top:14px" }, el("button", { class: "btn on", text: "Copy the tally as Markdown", on: { click: (e) => { pre.style.display = "block"; copyText(mdText, e.target, pre); } } })), pre);
  return nodes;
}

// For the team: every design and screen, with the real names.
function browse() {
  const di = Math.max(0, D.findIndex((d) => d.id === params.get("design"))), view = params.get("screen") || S[0].id;
  const d = D[di], link = (dd, v) => `?browse=1&design=${dd}&screen=${v}`;
  const s = S.find((x) => x.id === view), z = s ? size(s) : { w: 1280, h: 800 };
  const f = el("iframe", { title: d.name, width: z.w, height: s ? Math.max(z.h, innerHeight - 220) : innerHeight - 220, style: "border:1px solid var(--line);border-radius:6px;background:#fff;display:block" });
  f.srcdoc = s ? screenDoc(d, s) : doc(d, d.styleSheet(LOOK.data));
  $("#app").replaceChildren(el("div", { class: "top" }, el("h1", { text: "The four designs" }), el("a", { class: "btn small", href: "?", text: "Back to the test" })),
    el("div", { class: "tabs" }, D.map((x) => el("a", { class: x === d ? "btn small on" : "btn small", href: link(x.id, view), text: x.name }))),
    el("p", { class: "soft", text: d.idea }),
    el("div", { class: "tabs" }, S.map((x) => el("a", { class: x.id === view ? "btn small on" : "btn small", href: link(d.id, x.id), text: x.name })), el("a", { class: view === "style" ? "btn small on" : "btn small", href: link(d.id, "style"), text: "Style sheet" })),
    f);
}

// ?sheet=all, ?sheet=<screen id>, ?sheet=axes: labelled pictures and the table of positions, for the deck.
function sheet(which) {
  document.body.className = "sheet";
  const out = [];
  if (which === "axes" || which === "all") out.push(el("section", { style: "margin-bottom:40px" }, el("h2", { text: "The four designs, axis by axis" }),
    el("table", {}, el("tr", {}, el("th", { text: "" }), D.map((d) => el("th", { text: d.name }))), el("tr", {}, el("th", { text: "Idea" }), D.map((d) => el("td", { text: d.idea }))),
      ["composition", "menu", "density", "numbers", "shape", "type", "colour", "icons", "motion"].map((a) => el("tr", {}, el("th", { text: a[0].toUpperCase() + a.slice(1) }), D.map((d) => el("td", { text: (d.axes || {})[a] || "" })))))));
  for (const s of S) if (which === "all" || which === s.id) out.push(el("section", { style: "margin-bottom:40px" }, el("h2", { text: `${s.name}: four ways` }),
    el("div", { class: `grid4 ${s.device}` }, D.map((d) => el("div", { class: "cell" }, el("h3", {}, el("span", { text: d.name })), frame(d, s, s.device === "phone" ? 240 : 780))))));
  $("#app").replaceChildren(...out);
}

// The tester window, for online sessions: a second window showing only what the tester should see. The facilitator shares it
// and runs the test from this window, so prompts, answers, marks and notes stay off the shared screen.
let viewer = null, viewerFull = null;
const viewerOpen = () => !!(viewer && !viewer.closed);
const viewerButton = () => el("button", { class: viewerOpen() ? "btn small" : "btn small on", text: viewerOpen() ? "Tester window: bring to front" : "Open tester window", on: { click: openViewer } });
const VIEW_CSS = 'body{margin:0;background:#f1f1f3;color:#1c1c1f;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}#v{padding:12px 16px}.vh{font-weight:700;font-size:18px;margin:0 0 10px}.vgrid{display:grid;gap:12px}.vcell{background:#fff;border:1px solid #d3d3da;border-radius:10px;padding:8px}.vcell h3{margin:0 0 6px;font-size:20px}.vframe{position:relative;overflow:hidden;border:1px solid #d3d3da;border-radius:6px;background:#fff}.vframe iframe{border:0;transform-origin:0 0;display:block;background:#fff}.wait{display:grid;place-items:center;white-space:pre-line;height:85vh;color:#5b5b63;font-size:24px;text-align:center}';
function openViewer() {
  if (viewerOpen()) { viewer.focus(); return syncViewer(); }
  viewer = window.open("", "lockedin-tester", "width=1320,height=900");
  if (!viewer) { $("#app").prepend(el("p", { class: "warn", text: "The browser blocked the tester window. Allow pop-ups for this page, then press the button again." })); return; }
  viewer.document.open();
  viewer.document.write(`<!doctype html><html lang="en"><head><meta charset="utf-8"><title>LockedIn: designs</title><style>${VIEW_CSS}</style></head><body><div id="v"></div></body></html>`);
  viewer.document.close();
  viewer.addEventListener("resize", () => syncViewer());
  viewer.addEventListener("beforeunload", () => setTimeout(render, 200));
  render();
}
// One screen of one design, scaled to fit the width, scrollable.
function viewerFrame(d, s, width, height, scroll) {
  const z = size(s), k = Math.min(1, width / z.w);
  const f = el("iframe", { title: "Design", width: z.w, height: scroll ? Math.max(z.h, Math.ceil(height / k)) : z.h, scrolling: scroll ? "yes" : "no" });
  f.srcdoc = screenDoc(d, s); f.style.transform = `scale(${k})`;
  return el("div", { class: "vframe", style: `width:${Math.round(z.w * k)}px;height:${Math.round((scroll ? Math.max(z.h, Math.ceil(height / k)) : z.h) * k)}px` }, f);
}
function syncViewer() {
  if (!viewerOpen()) return;
  const box = viewer.document.getElementById("v"); if (!box) return;
  const W = viewer.innerWidth - 34, H = viewer.innerHeight - 70;
  const wait = (t) => box.replaceChildren(el("div", { class: "wait", text: t }));
  if (params.get("browse") || params.get("sheet") || params.get("tally") || st.at < 0 || !st.id) return wait("LockedIn look test\nThe test will start in a moment.");
  if (st.at > S.length) return wait("That's everything. Thank you!");
  if (viewerFull) { const { d, s, name } = viewerFull; return box.replaceChildren(el("p", { class: "vh", text: name }), viewerFrame(d, s, W, H, true)); }
  const cells = (s, cols) => { const cw = Math.floor((W - 12 * (cols - 1)) / cols) - 18; return el("div", { class: "vgrid", style: `grid-template-columns:repeat(${cols},minmax(0,1fr))` }, byLetter().map(({ d, letter }) => el("div", { class: "vcell" }, el("h3", { text: `Design ${letter}` }), viewerFrame(d, s, cw, 0, false)))); };
  if (st.at === S.length) return box.replaceChildren(el("p", { class: "vh", text: "Looking back over all of them" }), cells(S[0], 4));
  const s = S[st.at], si = st.at;
  if (!st.sub) return box.replaceChildren(el("p", { class: "vh", text: `Screen ${si + 1} of ${S.length}` }), viewerFrame(firstFor(si).d, s, Math.min(W, s.device === "phone" ? 390 : 1280), H, true));
  box.replaceChildren(el("p", { class: "vh", text: `Screen ${si + 1} of ${S.length}: the same screen, four ways` }), cells(s, s.device === "phone" ? 4 : 2));
}

function render() {
  $("#full").style.display = "none"; viewerFull = null;
  if (!D.length) return $("#app").replaceChildren(el("p", { text: "No designs are loaded." }));
  if (params.get("sheet")) return sheet(params.get("sheet"));
  if (params.get("browse")) return browse();
  if (params.get("tally")) return tally();
  if (st.at < 0 || !st.id) return home();
  if (st.at < S.length) return st.sub ? four(S[st.at], st.at) : alone(S[st.at], st.at);
  if (st.at === S.length) return wrap();
  results();
}
const draw = render; render = function () { draw(); syncViewer(); };
render();
</script>
